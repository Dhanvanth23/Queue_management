<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Calendar View</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/calendar.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Turf Booking Management System</h1>
            <nav>
                <a href="/admin" class="nav-link">Dashboard</a>
                <a href="/admin/calendar" class="nav-link active">Calendar View</a>
                <a href="/admin/reports" class="nav-link">Reports & Analytics</a>
                <a href="/admin/logout" class="nav-link">Logout</a>
            </nav>
        </header>

        <div class="admin-container">
            <div class="calendar-header">
                <button id="prevMonthBtn" class="calendar-nav-btn">&lt; Prev</button>
                <h2 id="currentMonthYear"></h2>
                <button id="nextMonthBtn" class="calendar-nav-btn">Next &gt;</button>
            </div>
            
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading calendar...</p>
            </div>
            
            <div id="calendar" class="calendar-grid">
                <div class="day-name">Sun</div>
                <div class="day-name">Mon</div>
                <div class="day-name">Tue</div>
                <div class="day-name">Wed</div>
                <div class="day-name">Thu</div>
                <div class="day-name">Fri</div>
                <div class="day-name">Sat</div>
                <!-- Days will be populated here -->
            </div>
            
            <div id="dayDetailsModal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modalDayTitle">Day Details</h2>
                        <span class="close-modal" onclick="closeDayDetailsModal()">&times;</span>
                    </div>
                    <div id="dayAppointmentsList" class="modal-body">
                        <!-- Appointments will be listed here -->
                    </div>
                    <div class="modal-buttons">
                        <button class="modal-btn primary" onclick="closeDayDetailsModal()">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/calendar.js"></script>
</body>
</html>
