<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - reports</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/reports.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Appointment Management System</h1>
            <nav>
                <a href="/admin" class="nav-link">Admin Panel</a>
                <a href="/admin/calendar" class="nav-link">Calendar View</a>
                <a href="/admin/reports" class="nav-link active">reports</a>
                <a href="/admin/logout" class="nav-link">Logout</a>
            </nav>
        </header>

        <div class="reports-container">
            <h2>reports & Analytics</h2>
            <div class="reports-cards">
                <div class="card">
                    <h3>Total Appointments</h3>
                    <p id="totalAppointments">0</p>
                </div>
                <div class="card">
                    <h3>Approved</h3>
                    <p id="approvedAppointments">0</p>
                </div>
                <div class="card">
                    <h3>Pending</h3>
                    <p id="pendingAppointments">0</p>
                </div>
                <div class="card">
                    <h3>Cancelled</h3>
                    <p id="cancelledAppointments">0</p>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-card">
                    <h3>Appointments by Status</h3>
                    <canvas id="statusChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Appointments Trend (Last 30 Days)</h3>
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/reports.js"></script>
</body>
</html>
